<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Elysium Engine</title>
  <style>
    body { margin:0; background:#101522; color:#e8eefc; font-family:Arial,sans-serif; }
    header { padding:16px 20px; background:#171f33; border-bottom:1px solid #2a3552; }
    main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px; }
    canvas { background:#1c263d; border:1px solid #344263; border-radius:8px; width:100%; height:640px; }
    .panel { background:#171f33; border:1px solid #2a3552; border-radius:8px; padding:14px; }
    button,input { padding:10px; margin:4px 0; width:100%; box-sizing:border-box; }
  </style>
</head>
<body>
  <header><strong>Elysium Engine 0.1</strong></header>
  <main>
    <section class="panel">
      <input id="room" value="default" />
      <button id="connect">Conectar</button>
      <pre id="log"></pre>
    </section>
    <canvas id="game" width="960" height="640"></canvas>
  </main>
  <script src="/main.js"></script>
</body>
</html>
